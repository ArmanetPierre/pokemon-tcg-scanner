[project]
name = "pokemon-card-scanner-ml"
version = "0.1.0"
description = "Prototypage ML : dataset, embeddings et évaluation avant export Core ML"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open_clip_torch>=2.24",
    "transformers>=4.40",
    "numpy>=1.26",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Export iOS. Séparé car coremltools contraint fortement la version de torch :
# on ne veut pas que cette contrainte bloque le prototypage.
coreml = ["coremltools>=8.0"]
# Tests des invariants. Aucun n'a besoin de Vision ni du modèle : ils tournent
# partout, y compris sur un runner Linux.
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les modules sont importés en `src.x` comme dans les scripts, sans installer
# le paquet : `pip install -e .` n'expose pas `src/` en tant que tel.
pythonpath = ["."]
